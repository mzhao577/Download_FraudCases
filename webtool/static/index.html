<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraud Case Review</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14181f; --muted: #5b6472;
    --line: #dfe3e9; --accent: #1f5fa9; --accent-soft: #eaf1fa;
    --warn: #9a3412; --warn-soft: #fef3e7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column;
  }

  /* ---------------------------------------------------------------- top bar */
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
    flex: 0 0 auto;              /* never let the column layout squash it */
  }
  header .grow { flex: 1 1 auto; }
  select, input[type=search], button {
    font: inherit; padding: 5px 9px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--ink);
  }
  input[type=search] { min-width: 240px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .counter { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  kbd {
    font: 11px/1 ui-monospace, Menlo, monospace; background: #eef1f5;
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 2px 5px;
  }

  /* ------------------------------------------------------- fraud type tabs */
  #tabs {
    display: flex; align-items: stretch; gap: 4px; overflow-x: auto;
    padding: 0 12px; background: var(--panel);
    border-bottom: 1px solid var(--line); scrollbar-width: thin;
    flex: 0 0 auto; min-height: 42px;   /* pinned: otherwise the tabs clip */
  }
  #tabs::-webkit-scrollbar { height: 6px; }
  #tabs::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .tab {
    flex: 0 0 auto; cursor: pointer; white-space: nowrap;
    padding: 9px 12px 8px; border: 0; background: none; color: var(--muted);
    border-bottom: 3px solid transparent; border-radius: 0; font: inherit;
  }
  .tab:hover { color: var(--ink); background: #f7f9fb; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab .n {
    font-size: 11px; font-variant-numeric: tabular-nums; margin-left: 6px;
    background: #eef1f5; color: var(--muted); border-radius: 999px; padding: 1px 7px;
  }
  .tab.active .n { background: var(--accent-soft); color: var(--accent); }
  .tab:disabled { opacity: .35; cursor: default; }

  /* ------------------------------------------------------------- nav strip */
  #nav {
    display: flex; align-items: center; gap: 0; flex-wrap: wrap;
    padding: 6px 12px 9px; background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .navgroup { display: flex; align-items: center; }
  .navgroup button {
    border-radius: 0; border-right-width: 0; white-space: nowrap;
  }
  .navgroup button:first-child { border-radius: 6px 0 0 6px; }
  .navgroup button:last-child  { border-radius: 0 6px 6px 0; border-right-width: 1px; }
  .navgroup button.step  { font-variant-numeric: tabular-nums; color: var(--muted); }
  .navgroup button.main  { font-weight: 600; color: var(--accent); }
  .navgroup button.edge  { color: var(--muted); }
  #position {
    margin: 0 14px; font-variant-numeric: tabular-nums; white-space: nowrap;
    font-weight: 600;
  }
  #position .of { color: var(--muted); font-weight: 400; }
  #goto {
    width: 74px; text-align: center; font-variant-numeric: tabular-nums;
  }
  #nav .hint { color: var(--muted); font-size: 12px; margin-left: auto; }
  #progress {
    height: 3px; background: var(--line); flex: 0 0 100%; margin: 6px 0 -6px;
    border-radius: 2px; overflow: hidden;
  }
  #progress > div { height: 100%; background: var(--accent); width: 0; transition: width .15s; }

  /* ------------------------------------------------------------------ layout */
  main { flex: 1 1 auto; display: flex; min-height: 0; }

  /* case list, toggled */
  #list {
    width: 320px; flex: 0 0 320px; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--line);
  }
  #list.hidden { display: none; }
  .case {
    padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .case:hover { background: var(--accent-soft); }
  .case.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .case .name {
    font-size: 12px; word-break: break-word; margin-bottom: 3px;
  }
  .case .meta { font-size: 11px; color: var(--muted); }
  .case.nopdf .name::after { content: " (no PDF)"; color: var(--warn); }

  /* the two panels */
  #panels { flex: 1 1 auto; display: flex; min-width: 0; }
  #left  { flex: 1 1 58%; min-width: 0; border-right: 1px solid var(--line); background: #525659; }
  #right { flex: 1 1 42%; min-width: 0; overflow-y: auto; background: var(--panel); }
  #left iframe { width: 100%; height: 100%; border: 0; display: block; }
  #left .empty {
    height: 100%; display: grid; place-items: center; color: #cfd4da; padding: 24px;
    text-align: center;
  }

  /* ------------------------------------------------------- right hand panel */
  .title { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
  .title h1 { font-size: 15px; margin: 0 0 6px; word-break: break-word; line-height: 1.35; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11px; padding: 2px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid #cfe0f2;
    white-space: nowrap;
  }
  .chip.k { background: #f1f3f6; color: var(--muted); border-color: var(--line); }

  section { padding: 14px 18px; }
  section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 8px;
  }
  /* SchemeSummary sits at the top and is the thing you actually read */
  #summary p {
    margin: 0; font-size: 15px; line-height: 1.62;
    background: #fbfcfd; border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 6px; padding: 12px 14px;
  }
  #summary p.none { color: var(--muted); font-style: italic; border-left-color: var(--line); }

  /* every other column, at the bottom */
  #fields { border-top: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; vertical-align: top; padding: 7px 8px; border-bottom: 1px solid #edf0f3; }
  th {
    width: 38%; font-weight: 600; color: var(--muted); font-size: 12px;
    white-space: nowrap;
  }
  td { word-break: break-word; }
  td.empty { color: #aab1ba; }
  td.num { font-variant-numeric: tabular-nums; }
  mark { background: #ffe9a8; padding: 0 1px; }

  .banner {
    margin: 12px 18px; padding: 9px 12px; border-radius: 6px;
    background: var(--warn-soft); color: var(--warn); border: 1px solid #f5d8bd; font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <button id="toggleList" title="Show/hide the case list">&#9776; Cases</button>
  <select id="dataset"></select>
  <input type="search" id="q" placeholder="Search every field…" autocomplete="off">
  <span class="grow"></span>
  <span class="counter" id="counter">—</span>
</header>

<div id="tabs"></div>

<div id="nav">
  <div class="navgroup">
    <button data-jump="first" class="edge" title="First case (Home)">&#8676; First</button>
    <button data-jump="-50" class="step" title="Back 50 (shift+PageUp)">&minus;50</button>
    <button data-jump="-10" class="step" title="Back 10 (K or PageUp)">&minus;10</button>
    <button data-jump="-1" class="main" title="Previous case (k or &larr;)">&#8592; Previous</button>
    <button data-jump="1" class="main" title="Next case (j or &rarr;)">Next &#8594;</button>
    <button data-jump="10" class="step" title="Forward 10 (J or PageDown)">+10</button>
    <button data-jump="50" class="step" title="Forward 50 (shift+PageDown)">+50</button>
    <button data-jump="last" class="edge" title="Last case (End)">Last &#8677;</button>
  </div>

  <span id="position">—</span>
  <input type="number" id="goto" min="1" placeholder="go to #" title="Jump to a case number, then Enter">

  <span class="hint">
    <kbd>j</kbd>/<kbd>k</kbd> &plusmn;1 &nbsp; <kbd>J</kbd>/<kbd>K</kbd> &plusmn;10 &nbsp;
    <kbd>shift</kbd>+<kbd>PgDn</kbd>/<kbd>PgUp</kbd> &plusmn;50 &nbsp;
    <kbd>g</kbd> go to &nbsp; <kbd>/</kbd> search
  </span>
  <div id="progress"><div></div></div>
</div>

<main>
  <div id="list"></div>
  <div id="panels">
    <div id="left"><div class="empty">Select a case to view its source document</div></div>
    <div id="right"><div class="empty" style="padding:24px;color:var(--muted)">No case selected.</div></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state = { dataset: null, cases: [], pos: -1, q: "", ftype: "" };

// Highlight the search term wherever it shows up, so a hit is obvious.
function hl(text) {
  const t = esc(text);
  if (!state.q) return t;
  try {
    return t.replace(new RegExp(state.q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
  } catch { return t; }
}

const MONEY = /Amt$/i, NUMERIC = /Amt$|Time$/i;
function fmt(name, value) {
  if (value === "" || value == null) return '<td class="empty">—</td>';
  if (MONEY.test(name) && !isNaN(parseFloat(value))) {
    return `<td class="num">$${Number(value).toLocaleString(undefined, {maximumFractionDigits: 0})}</td>`;
  }
  return `<td class="${NUMERIC.test(name) ? "num" : ""}">${hl(value)}</td>`;
}

async function loadDatasets() {
  const sets = await (await fetch("/api/datasets")).json();
  $("#dataset").innerHTML = sets.map(s =>
    `<option value="${esc(s.key)}">${esc(s.key)} — ${s.cases} cases</option>`).join("");
  state.dataset = sets[0]?.key ?? null;
  if (sets.length < 2) $("#dataset").style.display = "none";
  await loadCases();
}

async function loadCases(keepPos = false) {
  const p = new URLSearchParams({ dataset: state.dataset });
  if (state.q) p.set("q", state.q);
  if (state.ftype) p.set("fraud_type", state.ftype);
  const data = await (await fetch("/api/cases?" + p)).json();
  state.cases = data.cases;

  renderTabs(data);

  $("#list").innerHTML = state.cases.map((c, i) => `
    <div class="case ${c.has_pdf ? "" : "nopdf"}" data-i="${i}">
      <div class="name">${hl(c.doc)}</div>
      <div class="meta">${esc(c.FraudType ?? "")}</div>
    </div>`).join("") ||
    '<div style="padding:16px;color:var(--muted)">No cases match.</div>';

  $("#counter").textContent = state.q || state.ftype
    ? `${data.count} of ${data.total}` : `${data.total} cases`;

  if (!keepPos || state.pos >= state.cases.length) state.pos = state.cases.length ? 0 : -1;
  render();
}

// Position readout, progress bar, and which nav buttons make sense right now.
function syncNav() {
  const n = state.cases.length, at = state.pos;
  $("#position").innerHTML = n
    ? `${at + 1} <span class="of">/ ${n}</span>`
    : `<span class="of">no cases</span>`;
  $("#progress > div").style.width = n ? `${((at + 1) / n) * 100}%` : "0";
  $("#goto").max = n || 1;

  document.querySelectorAll("#nav button[data-jump]").forEach(b => {
    const j = b.dataset.jump;
    if (!n || at < 0) { b.disabled = true; return; }
    if (j === "first") b.disabled = at === 0;
    else if (j === "last") b.disabled = at === n - 1;
    // A step button stays enabled while there is anywhere to go in that
    // direction - it clamps rather than refusing, so +50 near the end still
    // takes you to the last case.
    else b.disabled = (+j < 0) ? at === 0 : at === n - 1;
  });
}

// One tab per FraudType value, most common first, with live counts that follow
// the current search. "All" is always present so you can get back.
function renderTabs(data) {
  const total = data.searched_total ?? data.total;
  const tabs = [`<button class="tab ${state.ftype ? "" : "active"}" data-ft="">All${
    `<span class="n">${total}</span>`}</button>`];
  for (const t of data.fraud_types) {
    tabs.push(`<button class="tab ${state.ftype === t.value ? "active" : ""}" data-ft="${esc(t.value)}"
      title="${esc(t.value)} — ${t.count} case${t.count === 1 ? "" : "s"}">${esc(t.value)}<span class="n">${t.count}</span></button>`);
  }
  // A tab that is selected but has no hits under the current search would
  // otherwise disappear and leave nothing highlighted.
  if (state.ftype && !data.fraud_types.some(t => t.value === state.ftype)) {
    tabs.push(`<button class="tab active" data-ft="${esc(state.ftype)}">${esc(state.ftype)}<span class="n">0</span></button>`);
  }
  $("#tabs").innerHTML = tabs.join("");
  const act = $("#tabs .tab.active");
  if (act) act.scrollIntoView({ block: "nearest", inline: "nearest" });
}

async function render() {
  document.querySelectorAll(".case").forEach(e =>
    e.classList.toggle("active", +e.dataset.i === state.pos));
  syncNav();

  if (state.pos < 0) return;
  const active = document.querySelector(".case.active");
  if (active) active.scrollIntoView({ block: "nearest" });

  const c = await (await fetch(
    `/api/case/${state.cases[state.pos].index}?dataset=${encodeURIComponent(state.dataset)}`)).json();

  $("#left").innerHTML = c.pdf_url
    ? `<iframe src="${esc(c.pdf_url)}#view=FitH" title="Source document"></iframe>`
    : `<div class="empty">No PDF found for<br><strong>${esc(c.doc)}</strong></div>`;

  // Title = DocumentName + FraudType. Summary on top, remaining columns below.
  const titleName = c.title.find(t => /document/i.test(t.name))?.value ?? c.doc;
  const chips = c.title.filter(t => !/document/i.test(t.name));
  const skip = new Set([...c.title.map(t => t.name), c.summary_column].filter(Boolean));

  $("#right").innerHTML = `
    <div class="title">
      <h1>${hl(titleName)}</h1>
      <div class="chips">
        ${chips.map(t => `<span class="chip">${esc(t.value || "—")}</span>`).join("")}
        <span class="chip k">case ${state.pos + 1} of ${state.cases.length}</span>
      </div>
    </div>
    ${c.has_pdf ? "" : '<div class="banner">This row has no matching PDF in the dataset folder.</div>'}
    <section id="summary">
      <h2>${esc(c.summary_column ?? "Summary")}</h2>
      ${c.summary_text
        ? `<p>${hl(c.summary_text)}</p>`
        : '<p class="none">No summary text for this case.</p>'}
    </section>
    <section id="fields">
      <h2>All summary fields</h2>
      <table><tbody>
        ${c.fields.filter(f => !skip.has(f.name)).map(f =>
          `<tr><th>${esc(f.name)}</th>${fmt(f.name, f.value)}</tr>`).join("")}
      </tbody></table>
    </section>`;
}

// Clamp rather than refuse: "+50" with 12 cases left should land on the last
// one, not do nothing.
function goTo(i) {
  if (!state.cases.length) return;
  const n = Math.max(0, Math.min(state.cases.length - 1, i));
  if (n !== state.pos) { state.pos = n; render(); }
}
function move(d) { goTo(state.pos + d); }

function jump(what) {
  if (what === "first") return goTo(0);
  if (what === "last") return goTo(state.cases.length - 1);
  move(+what);
}

// ------------------------------------------------------------------- events
$("#list").addEventListener("click", e => {
  const el = e.target.closest(".case");
  if (el) { state.pos = +el.dataset.i; render(); }
});
$("#toggleList").addEventListener("click", () => $("#list").classList.toggle("hidden"));
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button[data-jump]");
  if (b) jump(b.dataset.jump);
});
$("#goto").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const v = parseInt(e.target.value, 10);
  if (!isNaN(v)) { goTo(v - 1); e.target.value = ""; e.target.blur(); }
});
$("#dataset").addEventListener("change", e => {
  state.dataset = e.target.value; state.ftype = ""; loadCases();
});
$("#tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (!t) return;
  state.ftype = t.dataset.ft;   // "" on the All tab
  loadCases();
});

let timer;
$("#q").addEventListener("input", e => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value.trim(); loadCases(); }, 220);
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  const k = e.key;
  // shift+J / shift+K step 50, plain J / K step 10, lowercase steps 1.
  if (k === "j" || k === "ArrowDown" || k === "ArrowRight") { e.preventDefault(); move(1); }
  else if (k === "k" || k === "ArrowUp" || k === "ArrowLeft") { e.preventDefault(); move(-1); }
  // `J` IS shift+j, so the two cannot be told apart - +-50 lives on
  // shift+PageDown/PageUp and on the buttons instead.
  else if (k === "J") { e.preventDefault(); move(10); }
  else if (k === "K") { e.preventDefault(); move(-10); }
  else if (k === "PageDown") { e.preventDefault(); move(e.shiftKey ? 50 : 10); }
  else if (k === "PageUp")   { e.preventDefault(); move(e.shiftKey ? -50 : -10); }
  else if (k === "Home") { e.preventDefault(); jump("first"); }
  else if (k === "End")  { e.preventDefault(); jump("last"); }
  else if (k === "/")    { e.preventDefault(); $("#q").focus(); }
  else if (k === "g")    { e.preventDefault(); $("#goto").focus(); }
});

loadDatasets();
</script>
</body>
</html>

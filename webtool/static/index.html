<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraud Case Review</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14181f; --muted: #5b6472;
    --line: #dfe3e9; --accent: #1f5fa9; --accent-soft: #eaf1fa;
    --warn: #9a3412; --warn-soft: #fef3e7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: var(--bg);
    display: flex; flex-direction: column;
  }

  /* ---------------------------------------------------------------- top bar */
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .grow { flex: 1 1 auto; }
  select, input[type=search], button {
    font: inherit; padding: 5px 9px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--ink);
  }
  input[type=search] { min-width: 240px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .counter { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  kbd {
    font: 11px/1 ui-monospace, Menlo, monospace; background: #eef1f5;
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 2px 5px;
  }

  /* ------------------------------------------------------------------ layout */
  main { flex: 1 1 auto; display: flex; min-height: 0; }

  /* case list, toggled */
  #list {
    width: 320px; flex: 0 0 320px; overflow-y: auto; background: var(--panel);
    border-right: 1px solid var(--line);
  }
  #list.hidden { display: none; }
  .case {
    padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .case:hover { background: var(--accent-soft); }
  .case.active { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .case .name {
    font-size: 12px; word-break: break-word; margin-bottom: 3px;
  }
  .case .meta { font-size: 11px; color: var(--muted); }
  .case.nopdf .name::after { content: " (no PDF)"; color: var(--warn); }

  /* the two panels */
  #panels { flex: 1 1 auto; display: flex; min-width: 0; }
  #left  { flex: 1 1 58%; min-width: 0; border-right: 1px solid var(--line); background: #525659; }
  #right { flex: 1 1 42%; min-width: 0; overflow-y: auto; background: var(--panel); }
  #left iframe { width: 100%; height: 100%; border: 0; display: block; }
  #left .empty {
    height: 100%; display: grid; place-items: center; color: #cfd4da; padding: 24px;
    text-align: center;
  }

  /* ------------------------------------------------------- right hand panel */
  .title { padding: 14px 18px 12px; border-bottom: 1px solid var(--line); }
  .title h1 { font-size: 15px; margin: 0 0 6px; word-break: break-word; line-height: 1.35; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 11px; padding: 2px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid #cfe0f2;
    white-space: nowrap;
  }
  .chip.k { background: #f1f3f6; color: var(--muted); border-color: var(--line); }

  section { padding: 14px 18px; }
  section h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 8px;
  }
  /* SchemeSummary sits at the top and is the thing you actually read */
  #summary p {
    margin: 0; font-size: 15px; line-height: 1.62;
    background: #fbfcfd; border: 1px solid var(--line);
    border-left: 3px solid var(--accent); border-radius: 6px; padding: 12px 14px;
  }
  #summary p.none { color: var(--muted); font-style: italic; border-left-color: var(--line); }

  /* every other column, at the bottom */
  #fields { border-top: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; vertical-align: top; padding: 7px 8px; border-bottom: 1px solid #edf0f3; }
  th {
    width: 38%; font-weight: 600; color: var(--muted); font-size: 12px;
    white-space: nowrap;
  }
  td { word-break: break-word; }
  td.empty { color: #aab1ba; }
  td.num { font-variant-numeric: tabular-nums; }
  mark { background: #ffe9a8; padding: 0 1px; }

  .banner {
    margin: 12px 18px; padding: 9px 12px; border-radius: 6px;
    background: var(--warn-soft); color: var(--warn); border: 1px solid #f5d8bd; font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <button id="toggleList" title="Show/hide the case list">&#9776; Cases</button>
  <select id="dataset"></select>
  <input type="search" id="q" placeholder="Search every field (e.g. 99215, overtime, hospice)…" autocomplete="off">
  <select id="ftype"><option value="">All fraud types</option></select>
  <span class="grow"></span>
  <span class="counter" id="counter">—</span>
  <button id="prev" title="Previous case (k or ←)">&#8592;</button>
  <button id="next" title="Next case (j or →)">&#8594;</button>
  <span class="counter"><kbd>j</kbd>/<kbd>k</kbd> to move</span>
</header>

<main>
  <div id="list"></div>
  <div id="panels">
    <div id="left"><div class="empty">Select a case to view its source document</div></div>
    <div id="right"><div class="empty" style="padding:24px;color:var(--muted)">No case selected.</div></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state = { dataset: null, cases: [], pos: -1, q: "", ftype: "" };

// Highlight the search term wherever it shows up, so a hit is obvious.
function hl(text) {
  const t = esc(text);
  if (!state.q) return t;
  try {
    return t.replace(new RegExp(state.q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
  } catch { return t; }
}

const MONEY = /Amt$/i, NUMERIC = /Amt$|Time$/i;
function fmt(name, value) {
  if (value === "" || value == null) return '<td class="empty">—</td>';
  if (MONEY.test(name) && !isNaN(parseFloat(value))) {
    return `<td class="num">$${Number(value).toLocaleString(undefined, {maximumFractionDigits: 0})}</td>`;
  }
  return `<td class="${NUMERIC.test(name) ? "num" : ""}">${hl(value)}</td>`;
}

async function loadDatasets() {
  const sets = await (await fetch("/api/datasets")).json();
  $("#dataset").innerHTML = sets.map(s =>
    `<option value="${esc(s.key)}">${esc(s.key)} — ${s.cases} cases</option>`).join("");
  state.dataset = sets[0]?.key ?? null;
  if (sets.length < 2) $("#dataset").style.display = "none";
  await loadCases();
}

async function loadCases(keepPos = false) {
  const p = new URLSearchParams({ dataset: state.dataset });
  if (state.q) p.set("q", state.q);
  if (state.ftype) p.set("fraud_type", state.ftype);
  const data = await (await fetch("/api/cases?" + p)).json();
  state.cases = data.cases;

  const sel = $("#ftype");
  if (sel.options.length <= 1 && data.fraud_types.length) {
    sel.innerHTML = '<option value="">All fraud types</option>' +
      data.fraud_types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("");
    sel.value = state.ftype;
  }

  $("#list").innerHTML = state.cases.map((c, i) => `
    <div class="case ${c.has_pdf ? "" : "nopdf"}" data-i="${i}">
      <div class="name">${hl(c.doc)}</div>
      <div class="meta">${esc(c.FraudType ?? "")}</div>
    </div>`).join("") ||
    '<div style="padding:16px;color:var(--muted)">No cases match.</div>';

  $("#counter").textContent = state.q || state.ftype
    ? `${data.count} of ${data.total}` : `${data.total} cases`;

  if (!keepPos || state.pos >= state.cases.length) state.pos = state.cases.length ? 0 : -1;
  render();
}

async function render() {
  document.querySelectorAll(".case").forEach(e =>
    e.classList.toggle("active", +e.dataset.i === state.pos));
  $("#prev").disabled = state.pos <= 0;
  $("#next").disabled = state.pos < 0 || state.pos >= state.cases.length - 1;

  if (state.pos < 0) return;
  const active = document.querySelector(".case.active");
  if (active) active.scrollIntoView({ block: "nearest" });

  const c = await (await fetch(
    `/api/case/${state.cases[state.pos].index}?dataset=${encodeURIComponent(state.dataset)}`)).json();

  $("#left").innerHTML = c.pdf_url
    ? `<iframe src="${esc(c.pdf_url)}#view=FitH" title="Source document"></iframe>`
    : `<div class="empty">No PDF found for<br><strong>${esc(c.doc)}</strong></div>`;

  // Title = DocumentName + FraudType. Summary on top, remaining columns below.
  const titleName = c.title.find(t => /document/i.test(t.name))?.value ?? c.doc;
  const chips = c.title.filter(t => !/document/i.test(t.name));
  const skip = new Set([...c.title.map(t => t.name), c.summary_column].filter(Boolean));

  $("#right").innerHTML = `
    <div class="title">
      <h1>${hl(titleName)}</h1>
      <div class="chips">
        ${chips.map(t => `<span class="chip">${esc(t.value || "—")}</span>`).join("")}
        <span class="chip k">case ${state.pos + 1} of ${state.cases.length}</span>
      </div>
    </div>
    ${c.has_pdf ? "" : '<div class="banner">This row has no matching PDF in the dataset folder.</div>'}
    <section id="summary">
      <h2>${esc(c.summary_column ?? "Summary")}</h2>
      ${c.summary_text
        ? `<p>${hl(c.summary_text)}</p>`
        : '<p class="none">No summary text for this case.</p>'}
    </section>
    <section id="fields">
      <h2>All summary fields</h2>
      <table><tbody>
        ${c.fields.filter(f => !skip.has(f.name)).map(f =>
          `<tr><th>${esc(f.name)}</th>${fmt(f.name, f.value)}</tr>`).join("")}
      </tbody></table>
    </section>`;
}

function move(d) {
  const n = state.pos + d;
  if (n >= 0 && n < state.cases.length) { state.pos = n; render(); }
}

// ------------------------------------------------------------------- events
$("#list").addEventListener("click", e => {
  const el = e.target.closest(".case");
  if (el) { state.pos = +el.dataset.i; render(); }
});
$("#toggleList").addEventListener("click", () => $("#list").classList.toggle("hidden"));
$("#prev").addEventListener("click", () => move(-1));
$("#next").addEventListener("click", () => move(1));
$("#dataset").addEventListener("change", e => {
  state.dataset = e.target.value; $("#ftype").innerHTML = '<option value="">All fraud types</option>';
  state.ftype = ""; loadCases();
});
$("#ftype").addEventListener("change", e => { state.ftype = e.target.value; loadCases(); });

let timer;
$("#q").addEventListener("input", e => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value.trim(); loadCases(); }, 220);
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.key === "j" || e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); move(1); }
  if (e.key === "k" || e.key === "ArrowUp"   || e.key === "ArrowLeft")  { e.preventDefault(); move(-1); }
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});

loadDatasets();
</script>
</body>
</html>
